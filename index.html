<script src="pdf.js" charset="utf-8"></script><script src="parse.js" charset="utf-8"></script><script src="committee.js" charset="utf-8"></script>
<script>
let WEEK=41,ORD=1501500,KIT=214500; // ORD/KIT are recalculated from the week in recompute()
const KEY='akiba_v3',TODAY=new Date((d=>d>'2026-10-06'?d:'2026-10-06')(new Date(Date.now()+108e5).toISOString().slice(0,10))),CAPSH=10220,FUT=28000;
const $=i=>document.getElementById(i),KSh=n=>'KSh'+Number(n).toLocaleString('en-KE',{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2}),iso=d=>d.toISOString().slice(0,10);
/* Officers only. Members never log in: they vote and get reports on WhatsApp.
   vote = record members' WhatsApp votes, sign = officer approval of a loan, report = make/send PDFs */
const ROLES={chairman:['sign','vote','report','schedule'],treasurer:['contrib','loan','repay','fine','expense','bank','import','vote','sign','disburse','report'],secretary:['member','vote','sign','attend']};
function seed(){const N=['Francis Githui','Stephen Kinuthia','Dennis Wambui','Ashford Kariuki','Nelson Karanja','Achola Silas','Ann Wambui','Mary Njogu','Munene Martin','Mercy Murugi','Hesbon Ogera'];
const L=[['Ashford Kariuki',30000,'2026-07-08'],['Hesbon Ogera',50000,'2026-09-01'],['Mary Njogu',20000,'2026-09-03'],['Francis Githui',30000,'2026-08-24'],['Mercy Murugi',50000,'2026-09-04'],['Achola Silas',50000,'2026-09-04'],['Nelson Karanja',50000,'2026-09-16']];
return{cfg:{rate:5,fee:200,maxm:3,fine:100},m:N.map((n,i)=>({id:i+1,n,fines:0,paid:i<8?2000:0})),
loans:L.map((l,i)=>({id:i+1,who:l[0],p:l[1],date:l[2],ok:true,feePaid:200,h:[]})),fines:[],
bank:[{d:'2026-09-20',t:'AGM / Group Event Expense',cat:'Expense',amt:-30000,rec:true}],bal:85708.61,audit:[]}}
let S=JSON.parse(localStorage.getItem(KEY)||'null')||seed(),R=null,PG='Dashboard',T=null;
const save=()=>localStorage.setItem(KEY,JSON.stringify(S)),can=x=>ROLES[R].includes(x);
const log=(a,r,b,c)=>{S.audit.unshift({t:iso(TODAY)+' '+new Date().toTimeString().slice(0,5),u:R,a,r,b:b??'—',c:c??'—'});save()};
/* ---- Week 41 (6 Oct 2026) one-time update: contributions received + Dennis Wambui loan request ---- */
function wk41(){if((S.wk||0)>=41)return;
const C=[['Mercy Murugi',2000],['Munene Martin',2000],['Mary Njogu',2000],['Francis Githui',2000],['Ann Wambui',2000],['Stephen Kinuthia',2000],['Achola Silas',2000],['Hesbon Ogera',2000],['Ashford Kariuki',2000],['Dennis Wambui',2225],['Nelson Karanja',2225]],d=iso(TODAY);
S.m.forEach(m=>m.paid=0);
C.forEach(([n,a])=>{const m=S.m.find(x=>x.n==n);if(!m)return;m.paid=Math.min(2000,a);S.bal+=a;
S.bank.unshift({d,t:'Contribution: '+n+(a>2000?' (KSh'+(a-2000)+' above weekly 2,000)':''),cat:'Contribution',amt:a,rec:false});
S.audit.unshift({t:d+' 09:00',u:'treasurer',a:'Treasurer recorded contribution (week 41)',r:n,b:'Pending',c:'Paid'})});
const dw=S.m.find(x=>x.n=='Dennis Wambui');
if(dw&&!S.loans.some(l=>!l.ok&&l.who==dw.n&&l.p==90000)){S.loans.push({id:S.loans.length+1,who:dw.n,p:90000,date:d,ok:false,feePaid:0,h:[]});
S.audit.unshift({t:d+' 09:05',u:'treasurer',a:'Treasurer submitted loan application',r:dw.n,b:'—',c:'KSh90,000'})}
S.wk=41;localStorage.setItem(KEY,JSON.stringify(S))}
wk41();migrate();
const toast=m=>{const t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2600)};
const sheet=h=>{if(CAP){CAPH=h;return}$('shb').innerHTML='<div class="grab"></div>'+h;dirty=false;$('sh').style.display='flex';document.body.classList.add('so')},closeS=()=>sheetOpen()?closeSheet():back();
const ini=n=>n.split(' ').map(x=>x[0]).slice(0,2).join('');
/* ---- logic ---- */
const addM=(d,n)=>{const x=new Date(d);x.setMonth(x.getMonth()+n);return x};
function LI(l){const mat=addM(l.date,S.cfg.maxm),days=(mat-TODAY)/864e5,mi=l.p*S.cfg.rate/100,pr=l.p-l.h.reduce((s,h)=>s+h.pr,0),ip=l.h.reduce((s,h)=>s+h.i,0);
let st='Active';if(l.stage=='rej')st='Rejected';else if(!l.ok)st={vote:'Member vote',off:'Officer approval',ready:'Ready to disburse'}[l.stage]||'Pending approval';else if(pr<=0)st='Paid';else if(days<0)st='Default';else if(days<14)st='Due Soon';else if(l.h.some(x=>x.pr>0))st='Partly paid';if(l.ok&&pr>0&&st!='Default'&&overdueN(l)>0)st='Overdue';return{mat,mi,pr,ip,st}}
const live=()=>S.loans.filter(l=>l.ok),book=()=>live().reduce((s,l)=>s+LI(l).pr,0),total=()=>ORD+CAPSH+S.bal+book()+FUT;
const bd=s=>`<span class="bd ${{Default:'r',Overdue:'r','Due Soon':'a','Pending approval':'a','Member vote':'a','Officer approval':'a',Waiting:'a',Rejected:'r',Unpaid:'a',Pending:'a',Partial:'a'}[s]||''}">${s}</span>`;
function alloc(l,a){const f=Math.min(a,Math.max(0,S.cfg.fee-l.feePaid));a-=f;const i=Math.min(a,LI(l).mi);a-=i;return{f,i,pr:Math.min(a,LI(l).pr)}}
function attn(){const a=[],pend=S.m.filter(m=>m.paid<2000).length,pl=S.loans.filter(l=>!l.ok).length,df=S.loans.filter(l=>LI(l).st=='Default').length,ds=S.loans.filter(l=>LI(l).st=='Due Soon').length;
if(df)a.push(['r',df+' loan'+(df>1?'s':'')+' in default','Loans']);a.push(...loanAttn());if(ds)a.push(['a',ds+' loan'+(ds>1?'s':'')+' maturing within 14 days','Loans']);
if(pend)a.push(['a',pend+' members have not paid week '+WEEK+' (deadline midnight Sunday)','Contributions']);
a.push(['a','KSh2,800 2025 share variance needs review','Audit'],['a','≈KSh179,000 fines + interest awaiting audit','Audit']);return a}
/* ---- shell ---- */
const NAV=['Dashboard','Members','Contributions','Loans','Loan Kitty','Shares','Fines','Bank','Reports','Audit'];
function demo(r){$('u').value=r;$('p').value='1234';login()}
const RL=()=>R[0].toUpperCase()+R.slice(1);
function login(){const u=$('u').value.trim().toLowerCase();if(ROLES[u]&&$('p').value==='1234'){sessionStorage.currentUser=u;sessionStorage.currentRole=u;start();welcome()}else toast('Wrong username or password. Use a demo role below.')}
function start(){R=sessionStorage.currentRole;$('login').style.display='none';$('app').style.display='block';
$('hb').innerHTML=ic('menu');$('bk').innerHTML=ic('back');$('se').innerHTML=ic('search');$('bl').innerHTML=ic('bell')+'<span class="dot" id="nc"></span>';$('dt').innerHTML=ic('dots');$('lo').innerHTML=ic('out');
$('sav').textContent=$('pv').textContent=RL()[0];$('sn').textContent=RL();$('sr').textContent='Signed in as '+R;applyCol();cur='Dashboard';depth=0;history.replaceState({r:'Dashboard',d:0},'');render();idle()}
function askOut(){closeSheet(1);drawer(0);pm();sheet(`<h3>Log out of AKIBA SMART?</h3><p class="mut" style="margin:.5rem 0 1rem">You will need to sign in again to access the Chama management system. Your data stays saved on this device.</p><div class="row" style="border:0;gap:.6rem"><button class="btn o w" onclick="closeSheet(1)">Cancel</button><button class="btn r w" onclick="logout()">Logout</button></div>`)}
function logout(msg){$('app').style.display='none';$('login').style.display='grid';closeSheet(1);drawer(0);pm();sessionStorage.removeItem('currentUser');sessionStorage.removeItem('currentRole');R=null;clearTimeout(idleT);cur='Dashboard';depth=0;history.replaceState({r:'Dashboard',d:0},'');$('p').value='';if(typeof msg=='string')toast(msg)}
function welcome(){sheet(`<h3>Good morning, ${RL()}</h3><p class="mut">What needs your attention?</p>${attn().map(a=>`<div class="att" onclick="go('${a[2]}')"><i class="pt ${a[0]}"></i><div class="grow">${a[1]}</div>›</div>`).join('')}<p style="margin-top:1rem"><button class="btn w" onclick="closeSheet(1)">Go to dashboard</button></p>`)}
function theme(){const d=document.documentElement;d.dataset.t=d.dataset.t=='dark'?'':'dark';localStorage.setItem('akiba_theme',d.dataset.t)}
document.documentElement.dataset.t=localStorage.getItem('akiba_theme')||'';

Loans(){const n=s=>S.loans.filter(l=>LI(l).st==s).length,f=F.loan,shown=S.loans.filter(l=>f=='All'||(f=='In approval'?(!l.ok&&l.stage!='rej'):f=='Active'?['Active','Partly paid'].includes(LI(l).st):LI(l).st==f));
const reps=S.loans.flatMap(l=>l.h.map(h=>`<div class="ef"><span>${h.d} ${l.who}</span><b>${KSh(h.f+h.i+h.pr)}</b></div>`)).join('');
return`<div class="cd hero"><div class="k">Active loan book</div><div class="v">${KSh(book())}</div></div><div class="g4">${[['Active',n('Active')+n('Partly paid')],['Due Soon',n('Due Soon')],['Overdue',n('Overdue')],['Default',n('Default')]].map(s=>`<div class="cd" style="cursor:pointer" onclick="setF('${s[0]}')"><div class="k">${s[0]}</div><div class="vs">${s[1]}</div></div>`).join('')}</div><div style="height:.9rem"></div>${quick(['loan','repay'])}<div class="qa np"><button class="btn s o" onclick="go('Approvals')">Review applications</button>${can('report')?'<button class="btn s o" onclick="waOpen(loanReminderText())">Send loan reminder to group</button>':''}</div>${charts()}
<div class="cd"><div class="qa np" role="group" aria-label="Filter loans">${['All','Active','Due Soon','Overdue','Default','In approval','Rejected'].map(x=>`<button class="chip ${f==x?'on':''}" onclick="setF('${x}')">${x}</button>`).join('')}</div>${shown.map(lrow).join('')||empty('No loans in this view','Choose another filter to see more.')}</div><div class="cd"><h3>Recent repayments</h3>${reps||empty('No repayments yet','Use Record repayment to add one.')}</div>`},
Income(){const ip=S.loans.reduce((s,l)=>s+LI(l).ip,0),fe=S.loans.reduce((s,l)=>s+l.feePaid,0),fp=S.fines.filter(f=>f.st=='Paid').reduce((s,f)=>s+f.a,0);return`<div class="cd">${[['Loan interest',ip],['Processing fees',fe],['Fines paid',fp],['Bank dividends',S.bank.filter(b=>b.cat=='Dividend').reduce((s,b)=>s+b.amt,0)]].map(r=>`<div class="ef"><span>${r[0]}</span><b>${KSh(r[1])}</b></div>`).join('')}<p class="mut">Verified income since this system started.</p></div>${audit()}`},
Expenses(){const e=S.bank.filter(b=>b.amt<0);return`${quick(['expense'])}<div class="cd">${e.map(b=>`<div class="row" style="cursor:default"><div class="grow"><b>${b.t}</b><span class="mut">${b.d}</span></div><b>${KSh(-b.amt)}</b></div>`).join('')||empty('No expenses','Recorded expenses appear here.')}<p class="mut">The KSh30,000 AGM withdrawal is an expense. It reduced cash and is not added back.</p></div>`},
Approvals(){return approvals()},Meetings(){return meetingsView()},'Cash check'(){return cashCheckView()},
Help(){return`<div class="cd"><h3>Help</h3><p>Use <b>Home</b> for what needs attention, <b>Money</b> for cash, shares and fines, and <b>Loans</b> for the loan book. The <b>+</b> button records payments. Every transaction shows a preview before you confirm it.</p></div>`},
About(){return`<div class="cd"><h3>AKIBA SMART</h3><p class="mut">Chama Management &amp; Investment Platform. Simple. Transparent. Accountable.</p><p class="mut" style="margin-top:.6rem">Prototype. Financial figures are working/reconstructed figures and require final audit before official adoption.</p></div>`},
Settings(){const idm=localStorage.akiba_idle??15,dk=document.documentElement.dataset.t=='dark';return`<div class="cd"><h3>Profile</h3><div class="ef"><span>Signed in as</span><b>${RL()}</b></div></div><div class="cd"><h3>Notifications</h3><p class="mut">${attn().length} items need attention.</p><button class="btn s o" onclick="notif()">Open notifications</button></div><div class="cd"><h3>Appearance</h3><button class="btn s o" onclick="theme();render(1)">Switch to ${dk?'light':'dark'} mode</button></div><div class="cd"><h3>Security</h3><label for="idl">Sign out after inactivity</label><select id="idl" onchange="localStorage.akiba_idle=this.value;idle();toast('Saved')">${[[5,'5 minutes'],[15,'15 minutes'],[30,'30 minutes'],[0,'Never']].map(x=>`<option value="${x[0]}" ${x[0]==idm?'selected':''}>${x[1]}</option>`).join('')}</select></div><div class="cd"><h3>Data</h3><div class="qa"><button class="btn s o" onclick="exp()">Export data</button><button class="btn s o" onclick="$('imp').click()">Import data</button><button class="btn s r" onclick="reset()">Reset demo</button></div><input id="imp" type="file" accept=".json" hidden onchange="imp(this)"></div><div class="cd"><h3>About</h3><p class="mut">AKIBA SMART prototype. <a onclick="go('About')" style="color:var(--g);cursor:pointer">Read more</a></p></div>`}});
V.Calendar=V.Contributions;
const exp=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='akiba-data.json';a.click()};
function imp(el){const r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);migrate();render(1);toast('Imported')}catch(e){toast('That file is not valid Chama data.')}};r.readAsText(el.files[0])}
const reset=()=>{if(confirm('Reset all demo data? This cannot be undone.')){S=seed();wk41();migrate();render(1);toast('Demo data reset')}};
const fBank=()=>{if(!can('bank'))return toast('Your role cannot record bank transactions');form('Bank transaction',fld('Type','<select id="c"><option value="1">Money in</option><option value="-1">Money out</option></select>')+fld('Description','<input id="a">')+fld('Category','<select id="d">'+['Loan disbursement','Loan repayment','Contribution','Fine','Interest','Processing fee','Dividend','Bank charge','Other'].map(x=>`<option>${x}</option>`).join('')+'</select>')+fld('Amount','<input id="b" type="number">'),'pBank()')};
function pBank(){const d=$('a').value.trim(),a=+$('b').value,s=+$('c').value,cat=$('d').value;if(!d||a<=0)return toast('Add a description and an amount above zero');prev({title:'Bank transaction',rows:[['Description',d],['Category',cat],['Amount',(s<0?'−':'+')+KSh(a)]],eff:[['Bank',S.bal,S.bal+s*a]],ok(){S.bal+=s*a;S.bank.unshift({d:iso(TODAY),t:d,cat,amt:s*a,rec:false});log('Treasurer recorded bank transaction',d,KSh(S.bal-s*a),KSh(S.bal))},rc:null})}
/* ---- detail pages ---- */
function member(id){const m=S.m.find(x=>x.id==id),ls=S.loans.filter(l=>l.who==m.n);sheet(`<div style="display:flex;gap:.8rem;align-items:center"><div class="av">${ini(m.n)}</div><div><h3>${m.n}</h3><span class="mut">Member ${m.id} · Active</span></div></div><div class="g4" style="margin:1rem 0"><div class="cd"><div class="k">Ordinary shares</div><div class="vs">${KSh(ORD/11)}</div><div class="mut">indicative</div></div><div class="cd"><div class="k">Loan balance</div><div class="vs">${KSh(ls.reduce((s,l)=>s+LI(l).pr,0))}</div></div><div class="cd"><div class="k">Outstanding contribution</div><div class="vs">${KSh(2000-m.paid)}</div></div><div class="cd"><div class="k">Fines</div><div class="vs">${KSh(m.fines)}</div></div></div><h3>Payment timeline</h3><div class="tl"><div>Week ${WEEK}: ${m.paid>=2000?'paid '+KSh(m.paid):'pending, due Sunday'}</div>${ls.map(l=>`<div style="cursor:pointer" onclick="go('Loan/${l.id}')">Loan ${KSh(l.p)} issued ${l.date} (${LI(l).st}) ›</div>`).join('')}${S.fines.filter(f=>f.n==m.n).map(f=>`<div>Fine ${KSh(f.a)}: ${f.why}</div>`).join('')}</div>${memberExtra(m)}<p style="margin-top:1rem"><button class="btn w o" onclick="go('Statement/${id}')">View statement</button></p>`)}
function stmt(id){const m=S.m.find(x=>x.id==id),ls=S.loans.filter(l=>l.who==m.n);sheet(`<h3>AKIBA SMART</h3><b>Member statement: ${m.n}</b><div class="rc"><div class="ef"><span>Weekly contribution this week</span><b>${KSh(m.paid)}</b></div><div class="ef"><span>Ordinary shares (indicative)</span><b>${KSh(ORD/11)}</b></div>${ls.map(l=>`<div class="ef"><span>Loan ${l.date}</span><b>${KSh(LI(l).pr)} outstanding</b></div>`).join('')}<div class="ef"><span>Outstanding fines</span><b>${KSh(m.fines)}</b></div></div>${can('report')?`<button class="btn s" onclick="rptPdf('member',${id},'share')">Send PDF on WhatsApp</button> <button class="btn s o" onclick="rptPdf('member',${id},'dl')">Download PDF</button> `:''}<button class="btn s o" onclick="print()">Print</button> <button class="btn s o" onclick="closeS()">Close</button>`)}
function loan(id){const l=S.loans.find(x=>x.id==id),i=LI(l),pp=Math.round((l.p-i.pr)/l.p*100);let s=schedHtml(l);
if(!l.ok)return sheet(`<div class="k">Loan application</div><div class="v">${KSh(l.p)}</div><div>${l.who} ${bd(i.st)}</div><div class="ef"><span>Applied</span><b>${l.date}</b></div><div class="ef"><span>Monthly interest (${S.cfg.rate}%)</span><b>${KSh(i.mi)}</b></div><div class="ef"><span>Processing fee</span><b>${KSh(S.cfg.fee)}</b></div><div class="ef"><span>Maximum term</span><b>${S.cfg.maxm} months</b></div>${loanFlow(l)}`);
sheet(`<div class="k">Outstanding principal</div><div class="v">${KSh(i.pr)}</div>${bd(i.st)}<div class="pb"><i style="width:${pp}%"></i></div><p class="mut">Principal repaid ${KSh(l.p-i.pr)} / ${KSh(l.p)} (${pp}%)</p><div class="ef"><span>Rate</span><b>${S.cfg.rate}% / month</b></div><div class="ef"><span>Interest paid</span><b>${KSh(i.ip)}</b></div><div class="ef"><span>Processing fee</span><b>${KSh(S.cfg.fee)}</b></div><div class="ef"><span>Issued / matures</span><b>${l.date} / ${iso(i.mat)}</b></div><h3 style="margin-top:1rem">Repayment schedule</h3><div class="tl">${s}</div>${can('repay')&&l.ok?`<p style="margin-top:1rem"><button class="btn w" onclick="fRepay(${id})">Record repayment</button></p>`:''}${loanRecord(l)}`)}
const sh=t=>sheet(`<h3>${t} shares</h3><div class="v">${KSh(t=='Ordinary'?ORD:CAPSH)}</div><p class="mut">${t=='Ordinary'?'Indicative per member: '+KSh(ORD/11)+'. Individual histories will appear once records are entered.':'Held as a group total. Member-level capital records have not been supplied.'}</p><p style="margin-top:1rem"><button class="btn w o" onclick="closeS()">Close</button></p>`);
const txd=i=>{const b=S.bank[i];sheet(`<h3>${b.t}</h3><div class="ef"><span>Amount</span><b>${KSh(b.amt)}</b></div><div class="ef"><span>Category</span><b>${b.cat}</b></div><div class="ef"><span>Date</span><b>${b.d}</b></div><p style="margin-top:1rem">${b.rec?'':`<button class="btn" onclick="S.bank[${i}].rec=true;log('Reconciled transaction','${b.t}','Unmatched','Matched');back();toast('Matched')">Reconcile</button> `}<button class="btn o" onclick="closeS()">Close</button></p>`)};
const report=r=>{if(reportExt(r))return;sheet(`<h3>${r}</h3><p class="mut">${TODAY.toDateString()}</p><div class="rc"><div class="ef"><span>Ordinary shares</span><b>${KSh(ORD)}</b></div><div class="ef"><span>Capital shares</span><b>${KSh(CAPSH)}</b></div><div class="ef"><span>Bank</span><b>${KSh(S.bal)}</b></div><div class="ef"><span>Loan book</span><b>${KSh(book())}</b></div><div class="ef"><span>Projected interest</span><b>${KSh(FUT)}</b></div><div class="ef"><b>Working position</b><b>${KSh(total())}</b></div><p class="mut">Fines + interest ≈KSh179,000: subject to audit, excluded.</p></div><button class="btn s" onclick="print()">Print</button> <button class="btn s o" onclick="closeS()">Close</button>`)};
/* ---- forms -> preview -> confirm -> receipt ---- */
const mopts=()=>S.m.map(m=>`<option value="${m.id}">${m.n}</option>`).join(''),fld=(l,h)=>`<label>${l}</label>${h}`;
const form=(t,body,go)=>sheet(`<h3>${t}</h3>${body}<p style="margin-top:1rem"><button class="btn w" onclick="${go}">Preview</button></p>`);
const fContrib=()=>{if(!can('contrib'))return toast('Your role cannot record contributions');const u=S.m.filter(m=>m.paid<2000);form('Record contribution',fld('Member',`<select id="a">${u.map(m=>`<option value="${m.id}">${m.n}</option>`).join('')||mopts()}</select>`)+fld('Amount',`<input id="b" type="number" value="2000">`)+fld('Payment method','<select id="c"><option>M-Pesa</option><option>Bank</option><option>Cash</option></select>')+fld('Reference code (optional)','<input id="d" autocapitalize="characters" placeholder="e.g. SJK4H7P2QW">'),'pContrib()')};
function pContrib(){const m=S.m.find(x=>x.id==$('a').value),a=+$('b').value,ref=($('d').value||'').trim().toUpperCase();if(a<=0)return toast('Enter an amount above zero');if(ref&&S.seen[ref])return toast('That reference code was already recorded');
const pl=planPay(m.id,a,iso(TODAY),null),f=pl.fine,cn=pl.parts.reduce((s,x)=>s+x.amt,0);
prev({title:'Contribution',rows:[['Member',m.n],['Credited to',pl.parts.map(x=>'Week '+x.wk+(pl.parts.length>1?' ('+KSh(x.amt)+')':'')).join(', ')||'-'],...(f.due?[['Late fine ('+f.days+' day'+(f.days>1?'s':'')+' x '+KSh(S.cfg.lateFine||225)+')',KSh(f.due)+(f.out?', '+KSh(f.out)+' still owing':', paid')]]:[]),['Reference',ref||'-'],['SACCO standing order (ordinary shares)',KSh(cn*.75)],['Loan Kitty',KSh(cn*.25)]],eff:[['Bank',S.bal,S.bal+a]],ok(){const was=m.paid;applyPay(m,a,iso(TODAY),new Date().toTimeString().slice(0,5),ref,'Manual','',false);log('Treasurer recorded contribution',m.n,was>=2000?'Paid':'Pending',m.paid>=2000?'Paid':'Pending')},rc:['Contribution receipt',m.n,a]})}
const fFine=()=>{if(!can('fine'))return toast('Your role cannot record fines');form('Record fine',fld('Member',`<select id="a">${mopts()}</select>`)+fld('Reason','<select id="c"><option>Late weekly contribution</option><option>Late monthly contribution</option><option>Missed deadline</option><option>Other</option></select>')+fld('Amount',`<input id="b" type="number" value="${S.cfg.fine}">`),'pFine()')};
function pFine(){const m=S.m.find(x=>x.id==$('a').value),a=+$('b').value,w=$('c').value;prev({title:'Fine',rows:[['Member',m.n],['Reason',w],['Amount',KSh(a)]],eff:[[m.n+' outstanding fines',m.fines,m.fines+a]],ok(){m.fines+=a;S.fines.unshift({n:m.n,why:w,a,st:'Outstanding',d:iso(TODAY)});log('Treasurer recorded fine',m.n,KSh(m.fines-a),KSh(m.fines))},rc:['Fine notice',m.n,a]})}
const fExp=()=>{if(!can('expense'))return toast('Your role cannot record expenses');form('Record expense',fld('Description','<input id="a" placeholder="e.g. Meeting venue">')+fld('Amount',`<input id="b" type="number">`),'pExp()')};
function pExp(){const d=$('a').value.trim(),a=+$('b').value;if(!d||a<=0)return toast('Add a description and an amount above zero');prev({title:'Expense',rows:[['Description',d],['Amount',KSh(a)]],eff:[['Bank',S.bal,S.bal-a]],ok(){S.bal-=a;S.bank.unshift({d:iso(TODAY),t:d,cat:'Expense',amt:-a,rec:false});log('Treasurer recorded expense',d,KSh(S.bal+a),KSh(S.bal))},rc:['Expense voucher',d,a]})}
const fMember=()=>{if(!can('member'))return toast('Your role cannot add members');form('Add member',fld('Full name','<input id="a">')+fld('WhatsApp number (optional)','<input id="b" inputmode="tel" placeholder="0712 345 678">'),'pMember()')};
function pMember(){const n=$('a').value.trim(),ph=normPhone($('b').value);if(!n)return toast('Enter the member name');if($('b').value.trim()&&!ph)return toast('Enter a Kenyan number like 0712 345 678');if(S.m.some(m=>m.n.toLowerCase()==n.toLowerCase()))return toast('That member already exists. Duplicates are not allowed.');prev({title:'New member',rows:[['Name',n],['Member no.',S.m.length+1],['WhatsApp',ph?'0'+ph.slice(3):'Not added']],eff:[],ok(){S.m.push({id:S.m.length+1,n,fines:0,paid:0,ph});log('Secretary added member',n)},rc:['Membership record',n,0]})}
function fRepay(id){if(!can('repay'))return toast('Your role cannot record repayments');form('Record repayment',fld('Loan',`<select id="a">${live().map(l=>`<option value="${l.id}" ${l.id==id?'selected':''}>${l.who} (${KSh(LI(l).pr)})</option>`).join('')}</select>`)+fld('Amount',`<input id="b" type="number" value="2500">`)+fld('Method','<select><option>M-Pesa</option><option>Bank</option></select>'),'pRepay()')}
function pRepay(){const l=S.loans.find(x=>x.id==$('a').value),a=+$('b').value,x=alloc(l,a);if(a<=0)return toast('Enter an amount above zero');prev({title:'Loan repayment',rows:[['Borrower',l.who],['Processing fee',KSh(x.f)],['Interest',KSh(x.i)],['Principal',KSh(x.pr)]],eff:[['Bank',S.bal,S.bal+a],['Loan balance',LI(l).pr,LI(l).pr-x.pr]],ok(){l.feePaid+=x.f;l.h.push({d:iso(TODAY),f:x.f,i:x.i,pr:x.pr});S.bal+=a;S.bank.unshift({d:iso(TODAY),t:'Repayment: '+l.who,cat:'Loan repayment',amt:a,rec:false});log('Treasurer recorded loan repayment',l.who,KSh(LI(l).pr+x.pr),KSh(LI(l).pr))},rc:['Repayment receipt',l.who,a]})}
const fLoan=()=>{if(!can('loan'))return toast('Your role cannot start loan applications');form('New loan',fld('Member',`<select id="a">${mopts()}</select>`)+fld('Amount',`<input id="b" type="number" value="40000" max="50000">`),'pLoan()')};
function pLoan(){const m=S.m.find(x=>x.id==$('a').value),a=+$('b').value;if(a<=0)return toast('Enter an amount above zero');prev({title:'Loan application',rows:[['Borrower',m.n],['Principal',KSh(a)],['Monthly interest',KSh(a*S.cfg.rate/100)],['Processing fee',KSh(S.cfg.fee)],['Maximum term',S.cfg.maxm+' months'],['Next step','Members vote on WhatsApp, then Chairman, Treasurer and Secretary approve']],eff:[],ok(){S.loans.push({id:Math.max(0,...S.loans.map(x=>x.id))+1,who:m.n,p:a,date:iso(TODAY),ok:false,stage:'vote',votes:{},sig:{},feePaid:0,h:[]});log('Treasurer submitted loan application',m.n,'—',KSh(a))},rc:null,msg:'Submitted for member vote',nx:`<p style="margin-top:.5rem"><button class="btn o w" onclick="closeSheet(1);go('Loan/'+S.loans[S.loans.length-1].id)">Open loan and ask members to vote</button></p>`})}
function fineSt(i,st){S.fines[i].st=st;log('Treasurer marked fine '+st,S.fines[i].n);nav('Fines')}
function prev(t){T=t;sheet(`<h3>Transaction preview</h3><p class="mut">${t.title}</p>${t.rows.map(r=>`<div class="ef"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}${t.eff.length?'<h3 style="margin-top:1rem">Effect</h3>':''}${t.eff.map(e=>`<div class="ef"><span>${e[0]}</span><b>${KSh(e[1])} → ${KSh(e[2])}</b></div>`).join('')}<p style="margin-top:1rem"><button class="btn w" onclick="conf()">Confirm transaction</button></p><p style="margin-top:.5rem"><button class="btn o w" onclick="closeS()">Cancel</button></p>`)}
function conf(){const t=T;t.ok();save();nav(PG);const r=t.rc;sheet(`<h3>✓ ${t.msg||t.title+' recorded'}</h3>${r?`<div class="rc"><b>AKIBA SMART</b><br>${r[0]}<div class="ef"><span>For</span><b>${r[1]}</b></div><div class="ef"><span>Amount</span><b>${KSh(r[2])}</b></div><div class="ef"><span>Date</span><b>${iso(TODAY)}</b></div><div class="ef"><span>Reference</span><b>ASM-2026-${String(S.audit.length).padStart(4,'0')}</b></div></div><button class="btn s o" onclick="print()">Print</button> <button class="btn s o" onclick="navigator.share&&navigator.share({title:'AKIBA SMART receipt',text:'${r[0]}: ${r[1]} ${KSh(r[2])}'})">Share</button>`:''}${t.nx||''}<p style="margin-top:1rem"><button class="btn w" onclick="closeS()">Done</button></p>`)}
/* ---- PWA ---- */
let dip=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;$('inst').style.display='block'});
const installApp=()=>{if(dip){dip.prompt();dip=null}};
if('serviceWorker' in navigator&&location.protocol!=='file:')addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
if(sessionStorage.currentRole&&ROLES[sessionStorage.currentRole])start();
</script></body></html>
